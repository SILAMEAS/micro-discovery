server:
  port: 8761

spring:
  application:
    name: discovery
  config:
    import: optional:configserver:http://localhost:8888

# Eureka server Config
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false #because it eureka server no need to register itself
    fetch-registry: false       # no need to fetch registry
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

